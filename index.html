    // ១. ពិនិត្យថ្ងៃនិងទទួលកាលវិភាគ
    function getTodaySchedule() {

    // ៩. គណនាចម្ងាយរវាងពីរចំណុច (Haversine Formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Earth radius in meters
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c; // Distance in meters
    }

    // ១០. ទទួល GPS Location
    function getCurrentLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error('GPS មិនដំណើរការ'));
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    });
                },
                (error) => {
                    let errorMsg = 'មិនអាចរកទីតាំង';
                    if (error.code === 1) errorMsg = 'Open GPS Location';
                    else if (error.code === 2) errorMsg = 'GPS មិនដំណើរការ';
                    else if (error.code === 3) errorMsg = 'GPS timeout';
                    reject(new Error(errorMsg));
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    }

    // ១១. គណនានាទីយឺត (Calculate Late Minutes)
    function calculateLateMinutes() {
        const schedule = getTodaySchedule();
        if (!schedule) return 0;
        
        const now = new Date();
        const lateStart = new Date();
        // ប្រើម៉ោងចាប់ផ្តើមគណនាយឺត (ច័ន្ទ-សុក្រ: 7:05 AM, សៅរ៍: 8:30 AM)
        lateStart.setHours(schedule.lateStartHour, schedule.lateStartMinute, 0, 0);
        
        if (now > lateStart) {
            const diffMs = now - lateStart;
            const diffMins = Math.floor(diffMs / 60000);
            return diffMins;
        }
        return 0;
    }

    // ១២. បំប្លែននាទីទៅជាម៉ោង (Convert Minutes to Hours Format)
    function formatLateTime(minutes) {
        if (minutes === 0) return 'មកទាន់ម៉ោង';
        
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        
        if (hours === 0) {
            return `${mins} នាទី`;
        } else if (mins === 0) {
            return `${hours} ម៉ោង`;
        } else {
            return `${hours} ម៉ោង ${mins} នាទី`;
        }
    }

        message += `❌ <b>អវត្តមាន:</b> ${totalAbsent} នាក់\n`;

        // បុគ្គលិកមកយឺត

            message += `⚠️ <b>បុគ្គលិកមកយឺត:</b>\n\n`;

                const emoji = staff.lateMinutes > 120 ? '🔴' : staff.lateMinutes > 60 ? '🟡' : '🟠';
                message += `${emoji} <b>${index + 1}. ${staff.name}</b>\n`;
                message += `   💼 តួនាទី: ${staff.role}\n`;
                message += `   ⚠️ យឺត: <b>${staff.lateTime}</b>\n`;
                message += `   🕐 មកដល់: ${staff.time}\n\n`;
            });
            
            message += `🟠 < 1ម៉ោង | 🟡 1-2ម៉ោង | 🔴 > 2ម៉ោង\n`;
        } else {
            message += `━━━━━━━━━━━━━━━━━━━\n`;
            message += `✅ <b>ល្អប្រសើរ!</b> គ្មាននរណាមកយឺតទេ\n`;
        }
        
        // បុគ្គលិកអវត្តមាន
        if (absentStaff.length > 0) {
            message += `\n━━━━━━━━━━━━━━━━━━━\n`;
            message += `❌ <b>បុគ្គលិកអវត្តមាន (${totalAbsent} នាក់):</b>\n\n`;
            
            absentStaff.forEach((name, index) => {
                message += `${index + 1}. ${name}\n`;
            });
        } else {
            message += `\n━━━━━━━━━━━━━━━━━━━\n`;
            message += `🎉 <b>ល្អឥតខ្ចោះ!</b> បុគ្គលិកទាំងអស់វត្តមាន\n`;
        }
        
        await sendTelegramMessage(message);
        
        // កត់សម្គាល់ថាបានបញ្ជូនរួចហើយ
        localStorage.setItem('late_summary_sent', 'true');
    }

    // ១៨. បញ្ជូនសារទៅ Telegram
    async function sendTelegramMessage(message) {
        const encodedMessage = encodeURIComponent(message);
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodedMessage}&parse_mode=HTML`;

        await fetch(url, {
            method: 'GET',
            mode: 'no-cors'
        });
    }

    async function sendAttendance(type) {
        const name = document.getElementById('staffName').value.trim();
        const role = document.getElementById('staffRole').value.trim();
        const phone = document.getElementById('staffPhone').value.trim();
        const statusDiv = document.getElementById('status');

        if (!name || !role || !phone) {
            statusDiv.innerHTML = "<span style='color:orange'>⚠️ សូមបំពេញឱ្យគ្រប់!</span>";
            return;
        }

        // ពិនិត្យដែនកំណត់
        const isCheckin = type.includes('Check-In');
        const countType = isCheckin ? 'in' : 'out';
        const maxLimit = isCheckin ? 2 : 1;
        const currentCount = getCount(countType);
        
        if (currentCount >= maxLimit) {
            const limitText = isCheckin ? 'Check-In ២ដងរួច' : 'Check-Out ១ដងរួច';
            statusDiv.innerHTML = `<span style='color:orange'>⚠️ អ្នកបាន${limitText}ថ្ងៃនេះហើយ!</span>`;
            return;
        }

        statusDiv.innerHTML = "<span style='color:#666'>⏳ កំពុងពិនិត្យទីតាំង...</span>";

        try {
            // ទទួល GPS Location
            const userLocation = await getCurrentLocation();
            
            // គណនាចម្ងាយពីការិយាល័យ
            const distance = calculateDistance(
                OFFICE_LAT, OFFICE_LNG,
                userLocation.lat, userLocation.lng
            );

            // ពិនិត្យថាតើនៅក្នុងរង្វង់ការិយាល័យឬអត់
            if (distance > MAX_DISTANCE) {
                statusDiv.innerHTML = `<span style='color:red'>❌ អ្នកមិននៅក្នុងការិយាល័យ!<br>ចម្ងាយ: ${Math.round(distance)} ម៉ែត្រ<br>សូម scan QR នៅការិយាល័យ</span>`;
                return;
            }

            // បញ្ជូនទៅ Telegram
            statusDiv.innerHTML = "<span style='color:#666'>⏳ កំពុងបញ្ជូន...</span>";

            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            const date = now.toLocaleDateString('km-KH');
            const dayOfWeek = now.getDay();
            const dayName = dayOfWeek === 6 ? 'សៅរ៍' : '';
            
            // គណនានាទីយឺត (សម្រាប់ Check-In តែប៉ុណ្ណោះ)
            let lateMinutes = 0;
            let lateStatus = '';
            let isLate = false;
            
            if (isCheckin && currentCount === 0) { // Check-In ដំបូងតែប៉ុណ្ណោះ
                lateMinutes = calculateLateMinutes();
                const lateTimeFormatted = formatLateTime(lateMinutes);
                
                if (lateMinutes > 0) {
                    lateStatus = `\n⚠️ <b>មកយឺត: ${lateTimeFormatted}</b>`;
                    trackLateStaff(name, role, lateMinutes, time);
                    isLate = true;
                } else {
                    lateStatus = '\n✅ <b>មកទាន់ម៉ោង</b>';
                    isLate = false;
                }
                
                // រក្សាទុកបុគ្គលិក Check-In
                addCheckinStaff(name, role, time, isLate);
            }
            
            const countDisplay = isCheckin ? `(ដងទី ${currentCount + 1})` : '';
            const dayLabel = dayName ? ` - ${dayName}` : '';

            const message = `🏢 <b>របាយការណ៍វត្តមាន${dayLabel}</b>\n\n` +
                            `👤 ឈ្មោះ: <b>${name}</b>\n` +
                            `💼 តួនាទី: <b>${role}</b>\n` +
                            `📞 លេខទូរស័ព្ទ: <code>${phone}</code>\n` +
                            `📍 សកម្មភាព: <b>${type} ${countDisplay}</b>\n` +
                            `⏰ ម៉ោង: <code>${time}</code>\n` +
                            `📅 ថ្ងៃទី: <code>${date}</code>` +
                            lateStatus;

            await sendTelegramMessage(message);

            // បញ្ជូនសំរេច
            incrementCount(countType);
            updateUI();
            
            const lateText = lateMinutes > 0 ? ` (យឺត ${formatLateTime(lateMinutes)})` : '';
            statusDiv.innerHTML = `<span style='color:green'>✅ កត់ត្រាជោគជ័យ!${lateText}</span>`;

        } catch (error) {
            statusDiv.innerHTML = `<span style='color:red'>❌ ${error.message}<br>សូមបើក GPS/Location</span>`;
        }
    }
</script>
