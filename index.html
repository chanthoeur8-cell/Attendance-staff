<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Attendance System</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 12px; color: white; transition: 0.3s; font-size: 18px; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #007bff; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; opacity: 0.6; }
        #status { margin-top: 15px; font-size: 14px; min-height: 20px; }
        .counter { background: #f8f9fa; padding: 12px; border-radius: 10px; margin: 15px 0; font-size: 14px; }
        .counter-item { display: inline-block; margin: 0 10px; }
        .count { font-weight: bold; color: #28a745; font-size: 18px; }
        .warning-box { background: #fff3cd; border: 2px solid #ffc107; padding: 15px; border-radius: 10px; margin: 15px 0; color: #856404; font-size: 13px; }
        .time-info { background: #e3f2fd; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 12px; color: #1976d2; }
        .holiday-notice { background: #ffebee; border: 2px solid #f44336; padding: 20px; border-radius: 10px; margin: 15px 0; color: #c62828; font-size: 16px; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>Staff Attendance</h2>
    
    <input type="text" id="staffName" placeholder="Enter your FullName" oninput="saveData()">
    <input type="text" id="staffRole" placeholder="Enter your Role" oninput="saveData()">
    <input type="text" id="staffPhone" placeholder="Enter your PhoneNumber" oninput="saveData()">
    
    <p style="font-size: 11px; color: #888; margin: 15px 0;">បំពេញតែម្ដង វានឹងចងចាំជាប់រហូត</p>
    
    <div class="time-info" id="scheduleInfo">
        ⏰ ម៉ោងចូល: 7:00 AM<br>
        ⚠️ យឺតប្រសិនបើ Check-In លើសពី 7:05 AM<br>
        🌙 ស្គេនដងទី2: យឺតចាប់ពី 1:01 PM<br>
        📊 របាយការណ៍ស្វ័យប្រវត្តិ: 8:50 AM
    </div>
    
    <div class="counter">
        <div class="counter-item">
            Check-In: <span class="count" id="checkinCount">0/2</span>
        </div>
        <div class="counter-item">
            Check-Out: <span class="count" id="checkoutCount">0/1</span>
        </div>
    </div>

    <div class="warning-box">
        ⚠️ ត្រូវតែស្ថិតនៅក្នុងការិយាល័យ (10000m)<br>
        📱 សូមបើក GPS/Location
    </div>
    
    <button id="inBtn" class="btn btn-in" onclick="sendAttendance('Check-In 🟢')">Check-In</button>
    <button id="outBtn" class="btn btn-out" onclick="sendAttendance('Check-Out 🔵')">Check-Out</button>
    
    <div id="status"></div>
</div>

<script>
    const TELEGRAM_BOT_TOKEN = '8242266919:AAGE6uMJ_-UvM-3KBZkJVFhJyTLvcTVW5tQ';
    const TELEGRAM_CHAT_ID = -1003584563383;

    const OFFICE_LAT = 11.615808345753639;
    const OFFICE_LNG = 104.9076275084756;
    const MAX_DISTANCE = 10000;

    const SCHEDULE = {
        weekday: {
            workStartHour: 7,
            workStartMinute: 0,
            // ស្គេនដំបូង: យឺតចាប់ពី 7:05 AM
            lateStartHour: 7,
            lateStartMinute: 5,
            // ស្គេនដងទី2: យឺតចាប់ពី 1:01 PM
            lateStart2Hour: 13,
            lateStart2Minute: 1,
            reportHour: 8,
            reportMinute: 50
        },
        saturday: {
            workStartHour: 8,
            workStartMinute: 30,
            lateStartHour: 8,
            lateStartMinute: 30,
            // ស្គេនដងទី2 សៅរ៍: យឺតចាប់ពី 1:01 PM ដូចគ្នា
            lateStart2Hour: 13,
            lateStart2Minute: 1,
            reportHour: 9,
            reportMinute: 30
        }
    };

    const TOTAL_STAFF = 16;

    const ALL_STAFF_NAMES = [
        "Chanthoeurn Chhoeurn", "Ashley villela", "វិន សេរីភាព", "ផុត​ ហ័ន",
        "មុឹង​ ស្រីនីត", "អឿន កាណាល់", "ប៉ូ សូឌិន", "Leang Sopheavy",
        "ចំណាន វាសនា", "Born Chhorda", "Sok sreypich", "Eng sreynin",
        "កុសល សៀកម៉េង", "វ៉ាត មួយសុាំង", "ឈឹមវ៉ាន លីហង្ស", "Dorn Sreyneth"
    ];

    function getTodaySchedule() {
        const today = new Date();
        const dayOfWeek = today.getDay();
        if (dayOfWeek === 6) return SCHEDULE.saturday;
        return SCHEDULE.weekday;
    }
    
    function shouldSendReport() {
        return new Date().getDay() !== 0;
    }

    function updateScheduleInfo() {
        const scheduleInfo = document.getElementById('scheduleInfo');
        const dayOfWeek = new Date().getDay();
        
        if (dayOfWeek === 0) {
            scheduleInfo.innerHTML = `
                ⏰ ម៉ោងចូល: 7:00 AM (ថ្ងៃអាទិត្យ)<br>
                ⚠️ យឺតប្រសិនបើ Check-In លើសពី 7:05 AM<br>
                🌙 ស្គេនដងទី2: យឺតចាប់ពី 1:01 PM<br>
                📊 គ្មានរបាយការណ៍ស្វ័យប្រវត្តិ
            `;
        } else if (dayOfWeek === 6) {
            scheduleInfo.innerHTML = `
                ⏰ ម៉ោងចូល: 8:30 AM (ថ្ងៃសៅរ៍)<br>
                ⚠️ យឺតប្រសិនបើ Check-In លើសពី 8:30 AM<br>
                🌙 ស្គេនដងទី2: យឺតចាប់ពី 1:01 PM<br>
                📊 របាយការណ៍ស្វ័យប្រវត្តិ: 9:30 AM
            `;
        } else {
            scheduleInfo.innerHTML = `
                ⏰ ម៉ោងចូល: 7:00 AM<br>
                ⚠️ យឺតប្រសិនបើ Check-In លើសពី 7:05 AM<br>
                🌙 ស្គេនដងទី2: យឺតចាប់ពី 1:01 PM<br>
                📊 របាយការណ៍ស្វ័យប្រវត្តិ: 8:50 AM
            `;
        }
    }

    window.onload = () => {
        document.getElementById('staffName').value = localStorage.getItem('s_name') || '';
        document.getElementById('staffRole').value = localStorage.getItem('s_role') || '';
        document.getElementById('staffPhone').value = localStorage.getItem('s_phone') || '';
        
        checkAndResetDaily();
        updateUI();
        updateScheduleInfo();
        startAutoReportTimer();
    };

    function saveData() {
        localStorage.setItem('s_name', document.getElementById('staffName').value);
        localStorage.setItem('s_role', document.getElementById('staffRole').value);
        localStorage.setItem('s_phone', document.getElementById('staffPhone').value);
    }

    function checkAndResetDaily() {
        const today = new Date().toDateString();
        const lastDate = localStorage.getItem('last_attendance_date');
        
        if (lastDate !== today) {
            localStorage.setItem('checkin_count', '0');
            localStorage.setItem('checkout_count', '0');
            localStorage.setItem('last_attendance_date', today);
            localStorage.removeItem('late_staff_today');
            localStorage.removeItem('checkin_staff_list');
            localStorage.removeItem('late_summary_sent');
        }
    }

    function getCount(type) {
        const key = type === 'in' ? 'checkin_count' : 'checkout_count';
        return parseInt(localStorage.getItem(key) || '0');
    }

    function incrementCount(type) {
        const key = type === 'in' ? 'checkin_count' : 'checkout_count';
        localStorage.setItem(key, (getCount(type) + 1).toString());
    }

    function updateUI() {
        const checkinCount = getCount('in');
        const checkoutCount = getCount('out');
        
        document.getElementById('checkinCount').textContent = `${checkinCount}/2`;
        document.getElementById('checkoutCount').textContent = `${checkoutCount}/1`;
        
        const inBtn = document.getElementById('inBtn');
        const outBtn = document.getElementById('outBtn');
        
        inBtn.disabled = checkinCount >= 2;
        inBtn.style.backgroundColor = checkinCount >= 2 ? '#ccc' : '#28a745';
        
        outBtn.disabled = checkoutCount >= 1;
        outBtn.style.backgroundColor = checkoutCount >= 1 ? '#ccc' : '#007bff';
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getCurrentLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) { reject(new Error('GPS មិនដំណើរការ')); return; }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
                (err) => {
                    const msgs = { 1: 'Open GPS Location', 2: 'GPS មិនដំណើរការ', 3: 'GPS timeout' };
                    reject(new Error(msgs[err.code] || 'មិនអាចរកទីតាំង'));
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    // ========== គណនានាទីយឺត ==========
    // scanNumber: 1 = ស្គេនដំបូង (ព្រឹក), 2 = ស្គេនដងទី2 (រសៀល)
    function calculateLateMinutes(scanNumber) {
        const schedule = getTodaySchedule();
        const now = new Date();
        const lateStart = new Date();

        if (scanNumber === 2) {
            // ស្គេនដងទី2: យឺតចាប់ពី 1:01 PM
            lateStart.setHours(schedule.lateStart2Hour, schedule.lateStart2Minute, 0, 0);
        } else {
            // ស្គេនដំបូង: យឺតចាប់ពី 7:05 AM (ឬ 8:30 AM សៅរ៍)
            lateStart.setHours(schedule.lateStartHour, schedule.lateStartMinute, 0, 0);
        }

        if (now > lateStart) {
            return Math.floor((now - lateStart) / 60000);
        }
        return 0;
    }

    function formatLateTime(minutes) {
        if (minutes === 0) return 'មកទាន់ម៉ោង';
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        if (hours === 0) return `${mins} នាទី`;
        if (mins === 0) return `${hours} ម៉ោង`;
        return `${hours} ម៉ោង ${mins} នាទី`;
    }

    function trackLateStaff(name, role, lateMinutes, time, scanNumber) {
        let lateStaff = JSON.parse(localStorage.getItem('late_staff_today') || '[]');
        if (lateMinutes > 0) {
            lateStaff.push({ name, role, lateMinutes, lateTime: formatLateTime(lateMinutes), time, scanNumber });
            localStorage.setItem('late_staff_today', JSON.stringify(lateStaff));
        }
    }

    function addCheckinStaff(name, role, time, isLate) {
        let checkinList = JSON.parse(localStorage.getItem('checkin_staff_list') || '[]');
        if (!checkinList.find(s => s.name === name)) {
            checkinList.push({ name, role, time, isLate });
            localStorage.setItem('checkin_staff_list', JSON.stringify(checkinList));
        }
    }

    function getAbsentStaff() {
        const checkinNames = JSON.parse(localStorage.getItem('checkin_staff_list') || '[]').map(s => s.name);
        return ALL_STAFF_NAMES.filter(name => !checkinNames.includes(name));
    }

    function startAutoReportTimer() {
        setInterval(() => {
            if (!shouldSendReport()) return;
            const schedule = getTodaySchedule();
            const now = new Date();
            if (now.getHours() === schedule.reportHour && now.getMinutes() === schedule.reportMinute) {
                if (localStorage.getItem('late_summary_sent') !== 'true') {
                    sendLateStaffSummary();
                }
            }
        }, 60000);
    }

    async function sendLateStaffSummary() {
        if (localStorage.getItem('late_summary_sent') === 'true') return;

        const lateStaff = JSON.parse(localStorage.getItem('late_staff_today') || '[]');
        const checkinList = JSON.parse(localStorage.getItem('checkin_staff_list') || '[]');
        const absentStaff = getAbsentStaff();
        const dayOfWeek = new Date().getDay();
        const dayName = dayOfWeek === 6 ? 'សៅរ៍' : 'ធម្មតា';
        const today = new Date().toLocaleDateString('km-KH');

        const totalPresent = checkinList.length;
        const totalLate = lateStaff.length;
        const totalAbsent = absentStaff.length;
        const totalOnTime = totalPresent - totalLate;
        const attendanceRate = ((totalPresent / TOTAL_STAFF) * 100).toFixed(1);

        let message = `━━━━━━━━━━━━━━━━━━━\n`;
        message += `📊 <b>របាយការណ៍វត្តមាន ថ្ងៃ${dayName}</b>\n`;
        message += `📅 <b>${today}</b>\n`;
        message += `━━━━━━━━━━━━━━━━━━━\n\n`;
        message += `👥 <b>សរុប:</b> ${TOTAL_STAFF} នាក់\n`;
        message += `✅ <b>វត្តមាន:</b> ${totalPresent} នាក់ (${attendanceRate}%)\n`;
        message += `❌ <b>អវត្តមាន:</b> ${totalAbsent} នាក់\n`;
        message += `⏰ <b>មកទាន់ម៉ោង:</b> ${totalOnTime} នាក់\n`;
        message += `⚠️ <b>មកយឺត:</b> ${totalLate} នាក់\n\n`;

        if (lateStaff.length > 0) {
            message += `━━━━━━━━━━━━━━━━━━━\n`;
            message += `⚠️ <b>បុគ្គលិកមកយឺត:</b>\n\n`;
            lateStaff.sort((a, b) => b.lateMinutes - a.lateMinutes);
            lateStaff.forEach((staff, index) => {
                const emoji = staff.lateMinutes > 120 ? '🔴' : staff.lateMinutes > 60 ? '🟡' : '🟠';
                const scanLabel = staff.scanNumber === 2 ? ' (ស្គេន២)' : ' (ស្គេន១)';
                message += `${emoji} <b>${index + 1}. ${staff.name}</b>${scanLabel}\n`;
                message += `   💼 តួនាទី: ${staff.role}\n`;
                message += `   ⚠️ យឺត: <b>${staff.lateTime}</b>\n`;
                message += `   🕐 មកដល់: ${staff.time}\n\n`;
            });
            message += `🟠 < 1ម៉ោង | 🟡 1-2ម៉ោង | 🔴 > 2ម៉ោង\n`;
        } else {
            message += `━━━━━━━━━━━━━━━━━━━\n`;
            message += `✅ <b>ល្អប្រសើរ!</b> គ្មាននរណាមកយឺតទេ\n`;
        }

        if (absentStaff.length > 0) {
            message += `\n━━━━━━━━━━━━━━━━━━━\n`;
            message += `❌ <b>បុគ្គលិកអវត្តមាន (${totalAbsent} នាក់):</b>\n\n`;
            absentStaff.forEach((name, i) => { message += `${i+1}. ${name}\n`; });
        } else {
            message += `\n━━━━━━━━━━━━━━━━━━━\n`;
            message += `🎉 <b>ល្អឥតខ្ចោះ!</b> បុគ្គលិកទាំងអស់វត្តមាន\n`;
        }

        await sendTelegramMessage(message);
        localStorage.setItem('late_summary_sent', 'true');
    }

    async function sendTelegramMessage(message) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=HTML`;
        await fetch(url, { method: 'GET', mode: 'no-cors' });
    }

    async function sendAttendance(type) {
        const name = document.getElementById('staffName').value.trim();
        const role = document.getElementById('staffRole').value.trim();
        const phone = document.getElementById('staffPhone').value.trim();
        const statusDiv = document.getElementById('status');

        if (!name || !role || !phone) {
            statusDiv.innerHTML = "<span style='color:orange'>⚠️ សូមបំពេញឱ្យគ្រប់!</span>";
            return;
        }

        const isCheckin = type.includes('Check-In');
        const countType = isCheckin ? 'in' : 'out';
        const maxLimit = isCheckin ? 2 : 1;
        const currentCount = getCount(countType);

        if (currentCount >= maxLimit) {
            const limitText = isCheckin ? 'Check-In ២ដងរួច' : 'Check-Out ១ដងរួច';
            statusDiv.innerHTML = `<span style='color:orange'>⚠️ អ្នកបាន${limitText}ថ្ងៃនេះហើយ!</span>`;
            return;
        }

        statusDiv.innerHTML = "<span style='color:#666'>⏳ កំពុងពិនិត្យទីតាំង...</span>";

        try {
            const userLocation = await getCurrentLocation();
            const distance = calculateDistance(OFFICE_LAT, OFFICE_LNG, userLocation.lat, userLocation.lng);

            if (distance > MAX_DISTANCE) {
                statusDiv.innerHTML = `<span style='color:red'>❌ អ្នកមិននៅក្នុងការិយាល័យ!<br>ចម្ងាយ: ${Math.round(distance)} ម៉ែត្រ</span>`;
                return;
            }

            statusDiv.innerHTML = "<span style='color:#666'>⏳ កំពុងបញ្ជូន...</span>";

            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            const date = now.toLocaleDateString('km-KH');
            const dayOfWeek = now.getDay();
            const dayLabel = dayOfWeek === 6 ? ' - សៅរ៍' : '';

            let lateMinutes = 0;
            let lateStatus = '';
            let isLate = false;

            if (isCheckin) {
                // ស្គេនដំបូង (currentCount === 0) → ពិនិត្យ 7:05 AM
                // ស្គេនដងទី2 (currentCount === 1) → ពិនិត្យ 1:01 PM
                const scanNumber = currentCount + 1;
                lateMinutes = calculateLateMinutes(scanNumber);
                const lateTimeFormatted = formatLateTime(lateMinutes);

                if (lateMinutes > 0) {
                    const scanLabel = scanNumber === 2 ? 'ស្គេនដងទី2' : 'ស្គេនព្រឹក';
                    lateStatus = `\n⚠️ <b>មកយឺត (${scanLabel}): ${lateTimeFormatted}</b>`;
                    trackLateStaff(name, role, lateMinutes, time, scanNumber);
                    isLate = true;
                } else {
                    lateStatus = '\n✅ <b>មកទាន់ម៉ោង</b>';
                    isLate = false;
                }

                // រក្សាទុកតែស្គេនដំបូងប៉ុណ្ណោះ
                if (currentCount === 0) {
                    addCheckinStaff(name, role, time, isLate);
                }
            }

            const scanLabel = isCheckin ? `(ស្គេនដងទី ${currentCount + 1})` : '';
            const message = `🏢 <b>របាយការណ៍វត្តមាន${dayLabel}</b>\n\n` +
                            `👤 ឈ្មោះ: <b>${name}</b>\n` +
                            `💼 តួនាទី: <b>${role}</b>\n` +
                            `📞 លេខទូរស័ព្ទ: <code>${phone}</code>\n` +
                            `📍 សកម្មភាព: <b>${type} ${scanLabel}</b>\n` +
                            `⏰ ម៉ោង: <code>${time}</code>\n` +
                            `📅 ថ្ងៃទី: <code>${date}</code>` +
                            lateStatus;

            await sendTelegramMessage(message);

            incrementCount(countType);
            updateUI();

            const lateText = lateMinutes > 0 ? ` (យឺត ${formatLateTime(lateMinutes)})` : '';
            statusDiv.innerHTML = `<span style='color:green'>✅ កត់ត្រាជោគជ័យ!${lateText}</span>`;

        } catch (error) {
            statusDiv.innerHTML = `<span style='color:red'>❌ ${error.message}<br>សូមបើក GPS/Location</span>`;
        }
    }
</script>

</body>
</html>
